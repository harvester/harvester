name: "Upgrade Add Merged Upgrade Related PR to Project"

on:
  workflow_run:
    workflows: ["Upgrade Collect Merged Upgrade PR Data"]
    types: [completed]

env:
  UPGRADE_PROJECT_URL: https://github.com/orgs/harvester/projects/28
  PROJECT_OWNER: harvester
  PROJECT_NUMBER: 28

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      actions: read
    steps:
      - name: Download PR data artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: upgrade-pr-data
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.CUSTOM_GITHUB_TOKEN }}

      - name: Load PR data
        run: |
          cat pr-data.env >> $GITHUB_ENV

      - name: Add merged PR to project
        id: add-project
        env:
          GH_TOKEN: ${{ secrets.CUSTOM_GITHUB_TOKEN }}
        run: |
          item_id=$(gh project item-add "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" --url "$HTML_URL" --format json | jq -r '.id')
          sleep 5 # newly added items default to DONE; wait before overriding to avoid race
          echo "itemId=$item_id" >> $GITHUB_OUTPUT

      - name: Set project status to Todo
        if: steps.add-project.outputs.itemId != ''
        uses: rancher/gh-issue-mgr/update-project-fields@b70f0bdf12a03e5e3f33e4f92ccb6c89deb3ebd9 # main
        with:
          project-url: ${{ env.UPGRADE_PROJECT_URL }}
          github-token: ${{ secrets.CUSTOM_GITHUB_TOKEN }}
          item-id: ${{ steps.add-project.outputs.itemId }}
          field-keys: Status
          field-values: Todo
