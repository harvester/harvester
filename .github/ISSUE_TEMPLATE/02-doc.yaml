name: Document request
description: Create or update a document
title: "[DOC] "
type: "Doc"
labels: [ "kind/doc" ]
assignees:
-
body:
- type: markdown
  attributes:
    value: |
      Thanks for stopping by to let us know something could be better!
      
      For general questions or discussions, please use the [Discussions](https://github.com/harvester/harvester/discussions) tab.

- type: checkboxes
  attributes:
    label: AI Disclosure
    description: See the [AI Guidance](https://github.com/harvester/harvester/blob/master/CONTRIBUTING.md#ai-guidance).
    options:
    - label: This issue was created with the help of AI tools, and I have verified its content.

- type: textarea
  attributes:
    label: TL;DR
    description: Required if you ticked the box above. Summarize the request in under 100 words. Write it yourself; it must not be AI-generated.
  validations:
    required: false

- type: textarea
  attributes:
    label: Document request
    description: |
      Provide a clear and concise description of the document's purpose. Is your document request related to a problem? If so, please include the relevant issue number.
  validations:
    required: true

- type: textarea
  attributes:
    label: Additional context
    description: Please add any other context about the problem here.
  validations:
    required: false
