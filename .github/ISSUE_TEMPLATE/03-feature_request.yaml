name: Feature request
description: Suggest a feature or enhancement
title: "[FEATURE] "
type: "Feature"
labels: [ "kind/feature", "require/hep", "require/doc", "require/auto-e2e-test" ]
assignees:
-
body:
- type: markdown
  attributes:
    value: |
      Thanks for stopping by to let us know something could be better!
      
      For general questions or discussions, please use the [Discussions](https://github.com/harvester/harvester/discussions) tab.

- type: checkboxes
  attributes:
    label: AI Disclosure
    description: See the [AI Guidance](https://github.com/harvester/harvester/blob/master/CONTRIBUTING.md#ai-guidance).
    options:
    - label: This issue was created with the help of AI tools, and I have verified its content.

- type: textarea
  attributes:
    label: TL;DR
    description: Required if you ticked the box above. Summarize the request in under 100 words. Write it yourself; it must not be AI-generated.
  validations:
    required: false

- type: textarea
  attributes:
    label: Is your feature request related to a problem? Please describe (👍 if you like this request)
    description: A clear and concise description of what the problem is. Ex. I'm always frustrated when [...].
  validations:
    required: true

- type: textarea
  attributes:
    label: Describe the solution you'd like
    description: A clear and concise description of what you want to happen.
  validations:
    required: false

- type: textarea
  attributes:
    label: Describe alternatives you've considered
    description: A clear and concise description of any alternative solutions or features you've considered.
  validations:
    required: false

- type: textarea
  attributes:
    label: Additional context
    placeholder: Add any other context or screenshots about the feature request here.
  validations:
    required: false
