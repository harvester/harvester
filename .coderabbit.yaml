# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Harvester-specific CodeRabbit configuration.
# Org-wide defaults live in harvester/coderabbit/.coderabbit.yaml; `inheritance: true` merges
# them with the settings below (values here win, arrays are combined).
# Reference: https://docs.coderabbit.ai/configuration/configuration-inheritance
inheritance: true

reviews:
  path_filters:
    - "!pkg/generated/**"
    - "!api/openapi-spec/**"
    # Generated by scripts/generate-manifest from pkg/apis types (reviewed at the source).
    - "!deploy/charts/harvester-crd/templates/**"

  path_instructions:
    - path: "pkg/controller/**/*.go"
      instructions: |
        - Controllers must use Rancher Wrangler v3 (`github.com/rancher/wrangler/v3`), not controller-runtime.
        - Follow the Controller Pattern in AGENTS.md: a handler struct holding typed controllers/caches,
          a public `Register()` that obtains clients only via `config.Management.*Factory`, and
          `OnChange`/`OnRemove` registrations. Never instantiate client-go clients directly.
        - `OnChange` handlers must return the object (modified or not) so Wrangler can re-queue.
        - Prefer caches for reads and handle nil objects / deletion timestamps.
        - Reconcile logic must be idempotent; avoid unnecessary updates that cause hot loops.
        - New master controllers must be registered in `pkg/controller/master/setup.go`.
        - Every new controller needs unit tests.
    - path: "pkg/webhook/**/*.go"
      instructions: |
        - A webhook is either a mutator or a validator, never both.
        - Mutators must be of type `Mutator` implementing the `Admitter` interface; validators must
          implement the `Validator` interface (see `pkg/webhook/resources/virtualmachine/`).
        - Validators must not mutate objects; return clear, user-facing errors.
        - Check behavior on create, update and delete, and against upgrade/backward-compatibility scenarios.
    - path: "pkg/apis/**/*.go"
      instructions: |
        - CRD types are hand-written; check codegen/kubebuilder markers and JSON tags.
        - API changes must be backward compatible (no removed/renamed fields, safe defaults).
        - Changes require regenerating code (`go generate ./...`) and CRD manifests in
          `deploy/charts/harvester-crd/` (enforced in CI by `scripts/validate-ci`).
    - path: "pkg/api/**/*.go"
      instructions: |
        - REST handlers must use typed clients from `config.Management`.
        - Validate and sanitize all request input; check authorization/RBAC implications.
    - path: "pkg/settings/**/*.go"
      instructions: |
        - New or changed settings must have safe defaults and remain compatible with upgrades.
    # Replaces the central `**/*_test.go` entry (same path), so it restates that guidance.
    - path: "**/*_test.go"
      instructions: |
        - Prefer table-driven tests with `t.Run(tc.name, ...)` and `testify/assert` / `require`.
        - Unit tests must not depend on a real Kubernetes API; use fake clients from
          `pkg/util/fakeclients/`.
        - Reference pattern: `pkg/controller/master/supportbundle/controller_test.go`.
    - path: "tests/integration/**"
      instructions: |
        - Integration tests run on a kind cluster via `make test-integration`; ensure resources are
          cleaned up and waits use bounded timeouts.
    - path: "go.mod"
      instructions: |
        - After any go.mod change, `go mod tidy && go mod vendor` must be run and `go.mod`, `go.sum`
          and `vendor/` committed together (`go.sum` and `vendor/` are excluded from review).
        - Do not remove existing `replace` directives; they pin Rancher/Wrangler forks.
    - path: "{**/*.sh,scripts/**,package/**,hack/**,ci/**}"
      instructions: |
        - For shell scripts (many here have no extension), apply the checks in
          `.github/instructions/bash-sec.instructions.md`.
    - path: "{pkg/controller/master/upgrade/**,package/upgrade/**,package/upgrade-matrix.yaml}"
      instructions: |
        - Upgrade logic is high risk: steps must be idempotent and safe to re-run after a failure or
          node reboot, and must not leave the cluster in a partially upgraded state.
        - Changes must work for every source version allowed by `package/upgrade-matrix.yaml`
          (`minUpgradableVersion`); version-specific migrations must be gated by version.
        - Flag removed or renamed resources/settings that older versions still rely on during upgrade.
    - path: "addons/**"
      instructions: |
        - Follow `addons/README.md`: every addon needs a `metadata.yaml` (name, namespace, stage) and
          `addon-template.yaml` (built-in) or `addon.yaml` (standalone).
        - Check chart/version bumps stay consistent with `addons/version_info` and that default
          values are upgrade-safe.
    - path: "Makefile"
      instructions: |
        - Any target that runs `git` commands must depend on the `gen-version-env` target.
    - path: "deploy/charts/**"
      instructions: |
        - Helm chart changes must stay upgrade-safe; check value defaults, RBAC scope, and that
          templates render for both fresh install and upgrade.
    - path: "enhancements/**"
      instructions: |
        - These are HEPs (Harvester Enhancement Proposals). Review for clarity, completeness of
          motivation/goals/non-goals, API and upgrade impact, and test plan; skip code-style nits.
