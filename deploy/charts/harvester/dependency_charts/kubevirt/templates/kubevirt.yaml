# NB(thxCode): the api version controls by the app version specification of Chart.yaml.
apiVersion: {{ printf "kubevirt.io/%s" .Chart.AppVersion }}
kind: KubeVirt
metadata:
  # NB(thxCode): name should not be customized as below:
  # name: {{ template "kubevirt.fullname" . }}
  # because multiple KubeVirt resources are useless,
  # only the first instance will be deployed.
  name: kubevirt
  labels:
{{ include "kubevirt.labels" . | indent 4 }}
    app.kubernetes.io/name: kubevirt
    app.kubernetes.io/component: metadata
spec:
{{- if .Values.spec }}
{{- $spec := deepCopy .Values.spec }}
{{- $ipFamilyPolicy := ((.Values.global | default dict).ipFamilyPolicy) | default "SingleStack" }}
{{- $ipFamilyPatch := printf "{\"spec\":{\"ipFamilyPolicy\":\"%s\"}}" $ipFamilyPolicy }}
{{- $ipFamilyPatches := list
      (dict "patch" $ipFamilyPatch "resourceName" "virt-api" "resourceType" "Service" "type" "strategic")
      (dict "patch" $ipFamilyPatch "resourceName" "virt-exportproxy" "resourceType" "Service" "type" "strategic")
      (dict "patch" $ipFamilyPatch "resourceName" "kubevirt-operator-webhook" "resourceType" "Service" "type" "strategic")
      (dict "patch" $ipFamilyPatch "resourceName" "kubevirt-prometheus-metrics" "resourceType" "Service" "type" "strategic")
}}
{{- $existingPatches := list }}
{{- if $spec.customizeComponents }}
{{- $existingPatches = $spec.customizeComponents.patches | default list }}
{{- end }}
{{- $_ := set $spec "customizeComponents" (dict "patches" (concat $existingPatches $ipFamilyPatches)) }}
{{- /*
  additionalFeatureGates is kept outside .spec on purpose: it is written to the
  ManagedChart values by the Harvester `kubevirt-feature-gates` setting. Helm
  replaces lists instead of merging them, so a user list at
  spec.configuration.developerConfiguration.featureGates would pin the chart
  defaults of the release it was written on. Merging here lets every release
  keep its own defaults and adds the user gates on top. A gate must not appear
  in both featureGates and disabledFeatureGates (virt-operator rejects it), so
  user gates are also removed from the disabled list.
*/}}
{{- $extraGates := .Values.additionalFeatureGates | default list }}
{{- if $extraGates }}
{{- $config := $spec.configuration | default dict }}
{{- $devConfig := $config.developerConfiguration | default dict }}
{{- $enabled := uniq (concat ($devConfig.featureGates | default list) $extraGates) }}
{{- $disabled := list }}
{{- range ($devConfig.disabledFeatureGates | default list) }}
{{- if not (has . $extraGates) }}
{{- $disabled = append $disabled . }}
{{- end }}
{{- end }}
{{- $_ := set $devConfig "featureGates" $enabled }}
{{- if $disabled }}
{{- $_ := set $devConfig "disabledFeatureGates" $disabled }}
{{- else }}
{{- $_ := unset $devConfig "disabledFeatureGates" }}
{{- end }}
{{- $_ := set $config "developerConfiguration" $devConfig }}
{{- $_ := set $spec "configuration" $config }}
{{- end }}
{{ toYaml $spec | indent 2 }}
{{- end }}
