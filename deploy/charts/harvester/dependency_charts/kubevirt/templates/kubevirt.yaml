# NB(thxCode): the api version controls by the app version specification of Chart.yaml.
apiVersion: {{ printf "kubevirt.io/%s" .Chart.AppVersion }}
kind: KubeVirt
metadata:
  # NB(thxCode): name should not be customized as below:
  # name: {{ template "kubevirt.fullname" . }}
  # because multiple KubeVirt resources are useless,
  # only the first instance will be deployed.
  name: kubevirt
  labels:
{{ include "kubevirt.labels" . | indent 4 }}
    app.kubernetes.io/name: kubevirt
    app.kubernetes.io/component: metadata
spec:
{{- if .Values.spec }}
{{- $spec := deepCopy .Values.spec }}
{{- $ipFamilyPolicy := ((.Values.global | default dict).ipFamilyPolicy) | default "SingleStack" }}
{{- $ipFamilyPatch := printf "{\"spec\":{\"ipFamilyPolicy\":\"%s\"}}" $ipFamilyPolicy }}
{{- $ipFamilyPatches := list
      (dict "patch" $ipFamilyPatch "resourceName" "virt-api" "resourceType" "Service" "type" "strategic")
      (dict "patch" $ipFamilyPatch "resourceName" "virt-exportproxy" "resourceType" "Service" "type" "strategic")
      (dict "patch" $ipFamilyPatch "resourceName" "kubevirt-operator-webhook" "resourceType" "Service" "type" "strategic")
      (dict "patch" $ipFamilyPatch "resourceName" "kubevirt-prometheus-metrics" "resourceType" "Service" "type" "strategic")
}}
{{- $existingPatches := list }}
{{- if $spec.customizeComponents }}
{{- $existingPatches = $spec.customizeComponents.patches | default list }}
{{- end }}
{{- $_ := set $spec "customizeComponents" (dict "patches" (concat $existingPatches $ipFamilyPatches)) }}
{{ toYaml $spec | indent 2 }}
{{- end }}
