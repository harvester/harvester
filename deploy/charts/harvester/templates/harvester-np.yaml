apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: harvester-api-access
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: harvester
      app.kubernetes.io/component: apiserver
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: cattle-system
    ports:
    - protocol: TCP
      port: 8443
    - protocol: TCP
      port: 8080