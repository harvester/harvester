apiVersion: v1
kind: ServiceAccount
metadata:
  name: harvester-repository-job
  namespace: {{ printf "%q" .Name }}
  ownerReferences:
    - apiVersion: v1
      kind: Namespace
      name: {{ printf "%q" .Name }}
      uid: {{ printf "%q" .UID }}
      controller: true
      blockOwnerDeletion: true
# Each repository Job explicitly opts into an API token.
automountServiceAccountToken: false
